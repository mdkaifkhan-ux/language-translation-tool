<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌐 Language Translation Tool</h1>
            <p class="subtitle">Translate text using the Google Cloud Translation API</p>

            <div class="language-row">
                <div>
                    <label for="source">Source Language</label>
                    <select id="source">
                        <option value="auto">Auto Detect</option>
                        {% for name, code in languages.items() %}
                        <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="swap" id="swapBtn" title="Swap languages">⇄</button>

                <div>
                    <label for="target">Target Language</label>
                    <select id="target">
                        {% for name, code in languages.items() %}
                        <option value="{{ code }}" {% if code == "hi" %}selected{% endif %}>
                            {{ name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="text-row">
                <div>
                    <label for="inputText">Enter text</label>
                    <textarea id="inputText" maxlength="5000"
                        placeholder="Type something to translate..."></textarea>
                    <div class="counter"><span id="count">0</span>/5000</div>
                </div>

                <div>
                    <label for="outputText">Translated text</label>
                    <textarea id="outputText" readonly
                        placeholder="Translation will appear here..."></textarea>
                </div>
            </div>

            <div class="buttons">
                <button class="translate-btn" id="translateBtn">Translate</button>
                <button class="secondary" id="copyBtn">Copy</button>
                <button class="secondary" id="speakBtn">🔊 Speak</button>
                <button class="secondary" id="clearBtn">Clear</button>
            </div>

            <p id="status"></p>
        </div>
    </div>

<script>
const inputText = document.getElementById("inputText");
const outputText = document.getElementById("outputText");
const source = document.getElementById("source");
const target = document.getElementById("target");
const statusText = document.getElementById("status");

inputText.addEventListener("input", () => {
    document.getElementById("count").textContent = inputText.value.length;
});

document.getElementById("translateBtn").addEventListener("click", async () => {
    const text = inputText.value.trim();

    if (!text) {
        statusText.textContent = "Please enter text first.";
        return;
    }

    statusText.textContent = "Translating...";
    outputText.value = "";

    try {
        const response = await fetch("/translate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                text: text,
                source: source.value,
                target: target.value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Translation failed.");
        }

        outputText.value = data.translation;
        statusText.textContent = "Translation completed successfully.";
    } catch (error) {
        statusText.textContent = "Error: " + error.message;
    }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!outputText.value) return;
    await navigator.clipboard.writeText(outputText.value);
    statusText.textContent = "Translation copied!";
});

document.getElementById("speakBtn").addEventListener("click", () => {
    if (!outputText.value) return;
    const utterance = new SpeechSynthesisUtterance(outputText.value);
    speechSynthesis.speak(utterance);
});

document.getElementById("clearBtn").addEventListener("click", () => {
    inputText.value = "";
    outputText.value = "";
    document.getElementById("count").textContent = "0";
    statusText.textContent = "";
});

document.getElementById("swapBtn").addEventListener("click", () => {
    if (source.value === "auto") {
        statusText.textContent = "Select a source language before swapping.";
        return;
    }

    const oldSource = source.value;
    source.value = target.value;
    target.value = oldSource;

    const oldInput = inputText.value;
    inputText.value = outputText.value;
    outputText.value = oldInput;
    document.getElementById("count").textContent = inputText.value.length;
});
</script>
</body>
</html>
